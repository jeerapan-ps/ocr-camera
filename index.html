<!DOCTYPE html>

<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
  font-family:Arial;
  text-align:center;
  padding:20px;
  background:#f5f5f5;
}

video{
  width:100%;
  max-width:500px;
  border-radius:10px;
  background:black;
}

button{
  padding:12px 20px;
  margin:10px;
  font-size:16px;
}

textarea{
  width:100%;
  max-width:500px;
  height:200px;
  margin-top:15px;
}

canvas{
  display:none;
}
#focusRing{
position:absolute;
width:80px;
height:80px;
border:3px solid yellow;
border-radius:50%;
pointer-events:none;
transform:translate(-50%,-50%);
display:none;
}

#videoContainer{
position:relative;
display:inline-block;
}

</style>

</head>

<body>

<h2>OCR Camera</h2>

<div id="videoContainer">

<video
 id="video"
 autoplay
 playsinline
 muted
 style="width:100%;max-width:500px;background:black;"> </video>

  <div id="focusRing"></div>

</div>

<canvas id="canvas"></canvas>

<br>
<button onclick="startCamera()">เปิดกล้อง</button>
<button onclick="switchCamera()">สลับกล้อง</button>
<button onclick="scanText()">อ่านข้อความ</button>
<button onclick="copyText()">คัดลอก</button>
<br>

<textarea id="result"></textarea>

<script>

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const result = document.getElementById('result');

let stream = null;

let useFrontCamera = false;

async function startCamera(){

  try{

    if(stream){

      stream.getTracks().forEach(track => {
        track.stop();
      });

    }

    stream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode: useFrontCamera
          ? "user"
          : "environment"
      },

      audio:false

    });

    video.srcObject = stream;

  }catch(err){

    alert(err.name + "\n" + err.message);

  }

}

async function switchCamera(){

  useFrontCamera = !useFrontCamera;

  await startCamera();

}

async function scanText(){

  if(!stream){

    alert("กรุณาเปิดกล้องก่อน");

    return;
  }

  result.value = "กำลังอ่านข้อความ...";

  const ctx = canvas.getContext('2d');

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.drawImage(video,0,0);

  const {
    data:{ text }
  } = await Tesseract.recognize(
    canvas,
    'tha+eng'
  );

  result.value = text;

}

async function copyText(){

  await navigator.clipboard.writeText(
    result.value
  );

  alert("คัดลอกแล้ว");

}

  const focusRing = document.getElementById('focusRing');

video.addEventListener('click', async (e)=>{

if(!stream) return;

const rect = video.getBoundingClientRect();

const x = e.clientX - rect.left;
const y = e.clientY - rect.top;

focusRing.style.left = x + "px";
focusRing.style.top = y + "px";

focusRing.style.display = "block";

setTimeout(()=>{
focusRing.style.display = "none";
},1000);

    advanced:[

      {
        focusMode:"single-shot"
      }

  });

}

}

});

</script>


</body>
</html>
